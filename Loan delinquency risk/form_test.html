<!DOCTYPE html>
<html>
<head>
    <title>Quick Form Test</title>
    <style>
        body { margin: 40px; font-family: Arial, sans-serif; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        input, select { margin: 5px; padding: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🧪 Loan App Form Test</h1>
    <p><strong>Server:</strong> <span id="serverUrl">http://localhost:5003</span></p>
    
    <form id="testForm">
        <h3>Essential Fields Only (Quick Test)</h3>
        <div>
            <label>Interest Rate: <input name="interest_rate" type="number" value="3.75" required></label>
            <label>Loan Amount: <input name="unpaid_principal_bal" type="number" value="200000" required></label>
            <label>Term: <input name="Loan_term" type="number" value="18" required></label>
        </div>
        <div>
            <label>LTV: <input name="loan_to_value" type="number" value="80" required></label>
            <label>Source: <select name="source" required><option value="Y">Y</option></select></label>
            <label>Purpose: <select name="loan_purpose" required><option value="C86">C86</option></select></label>
        </div>
        <div>
            <label>Borrowers: <select name="number_of_borrowers" required><option value="2">2</option></select></label>
            <label>DTI: <input name="debt_to_income_ratio" type="number" value="29" required></label>
            <label>Credit Score: <input name="borrower_credit_score" type="number" value="809" required></label>
        </div>
        <div>
            <label>Annual Income: <input name="Annual Income" type="number" value="66000" required></label>
            <label>Age: <input name="Age" type="number" value="51" required></label>
            <label>Dependents: <select name="NumberOfDependents" required><option value="2">2</option></select></label>
        </div>
        <div>
            <label>Education: <select name="EducationLevel" required><option value="Bachelor's">Bachelor's</option></select></label>
            <label>Marital: <select name="MaritalStatus" required><option value="Married">Married</option></select></label>
            <label>Gender: <select name="Gender" required><option value="Female">Female</option></select></label>
        </div>
        <div>
            <label>Employment: <select name="EmploymentStatus" required><option value="Employed">Employed</option></select></label>
        </div>
        
        <br><br>
        <button type="submit">🚀 Test Form Submission</button>
    </form>
    
    <div id="results"></div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultsDiv = document.getElementById('results');
            const formData = new FormData(e.target);
            
            // Show what's being sent
            resultsDiv.innerHTML = '<h3>📤 Sending Data:</h3>';
            for (let [key, value] of formData.entries()) {
                resultsDiv.innerHTML += `<div><strong>${key}:</strong> ${value}</div>`;
            }
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: new URLSearchParams(formData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    resultsDiv.innerHTML += `
                        <div class="test-result success">
                            <h3>✅ SUCCESS!</h3>
                            <p><strong>Risk Level:</strong> ${result.risk_level}</p>
                            <p><strong>Probability:</strong> ${(result.delinquency_probability * 100).toFixed(1)}%</p>
                            <p><strong>Features:</strong> ${result.model_info?.features_analyzed} analyzed</p>
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    resultsDiv.innerHTML += `
                        <div class="test-result error">
                            <h3>❌ ERROR ${response.status}</h3>
                            <p>${errorText}</p>
                        </div>
                    `;
                }
            } catch (err) {
                resultsDiv.innerHTML += `
                    <div class="test-result error">
                        <h3>❌ NETWORK ERROR</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        });
        
        // Auto-test on load
        setTimeout(() => {
            document.getElementById('testForm').dispatchEvent(new Event('submit'));
        }, 1000);
    </script>
</body>
</html>
